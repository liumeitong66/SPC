    .detail-content{flex:1;min-height:0;overflow:auto;padding-right:2px}.return-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;line-height:1}.return-link:hover,.return-link:focus{text-decoration:none}.form-panel{padding:14px}.form-section{margin-bottom:14px;border:1px solid #e2e8f0;border-radius:7px;overflow:hidden}.form-section:last-child{margin-bottom:0}.form-section h2{height:42px;margin:0;padding:0 14px;display:flex;align-items:center;background:#f7f9fc;border-bottom:1px solid #e8edf2;color:#1f3552;font-size:15px}.section-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px;padding:14px}.section-fields.basic-fields{grid-template-columns:repeat(3,minmax(0,1fr))}.section-fields.monitor-fields{grid-template-columns:repeat(3,minmax(0,1fr))}.form-field{min-width:0}.form-field.full,.scope-field{grid-column:1/-1}.form-field label{display:block;margin-bottom:7px;color:#536277;font-size:12px;font-weight:600}.form-field em{color:#df4a4a;font-style:normal}.form-field input,.form-field select,.form-field textarea,.scope-trigger{width:100%;height:36px;padding:0 11px;border:1px solid #cfd8e4;border-radius:4px;background:#f7f9fc;color:#334155;font:13px/1.4 inherit;box-sizing:border-box}.form-field textarea{height:68px;padding-top:9px;resize:none}.form-field input[readonly],.form-field textarea[readonly],.form-field select:disabled{opacity:1;-webkit-text-fill-color:#334155;cursor:default}.push-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;grid-column:1/-1}.period-choice{height:36px;display:flex;align-items:center;gap:18px;padding:0 11px;border:1px solid #cfd8e4;border-radius:4px;background:#f7f9fc}.period-choice label{margin:0;display:flex;align-items:center;gap:6px;color:#334155;font-size:13px}.period-choice input{width:15px;height:15px;margin:0;accent-color:#3478f6}.scope-trigger{display:flex;align-items:center;justify-content:space-between;text-align:left}.scope-trigger:disabled{opacity:1;-webkit-text-fill-color:#334155}.rule-builder{padding:12px;border:1px solid #cfd8e4;border-radius:5px;background:#f8fafc}.rule-builder-head{display:flex;align-items:center;gap:8px;color:#475569;font-size:13px}.rule-builder-head select{width:154px;height:32px;padding:0 9px;border:1px solid #cfd8e4;border-radius:4px;background:#fff;color:#334155;opacity:1}.rule-line{display:grid;grid-template-columns:110px 110px minmax(160px,1fr) 96px 110px 64px;gap:8px;align-items:center;margin-top:10px}.rule-line select,.rule-line input{width:100%;height:34px;padding:0 9px;border:1px solid #cfd8e4;border-radius:4px;background:#fff;color:#334155;opacity:1;box-sizing:border-box}.rule-line input{-webkit-text-fill-color:#334155}.readonly-note{margin-top:8px;color:#8996a8;font-size:12px}.period-field[hidden]{display:none}@media(max-width:900px){.section-fields.basic-fields,.section-fields.monitor-fields{grid-template-columns:1fr 1fr}.rule-line{grid-template-columns:1fr 1fr 1fr}.detail-content{overflow:auto}}@media(max-width:720px){.main{padding-left:14px;padding-right:14px}.section-fields,.section-fields.basic-fields,.section-fields.monitor-fields,.push-row{grid-template-columns:1fr}.form-field.full,.scope-field{grid-column:1}.rule-line{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body data-page="alert-management">
  <aside class="sidebar"><div class="brand"><div class="mark"><i></i><i></i></div><div><strong>AOI SPC</strong><small>集中管理平台</small></div></div><div class="group nav-label">质量分析</div><nav class="nav"><a class="item nav-item" href="01-项目统计首页.html" style="text-decoration:none"><span class="ico nav-icon">◉</span>项目统计</a><a class="item nav-item" href="09-设备质量分析.html" style="text-decoration:none"><span class="ico nav-icon">◇</span>设备分析</a><a class="item nav-item" href="03-缺陷分析.html" style="text-decoration:none"><span class="ico nav-icon">▥</span>缺陷分析</a><a class="item nav-item" href="04-误报分析.html" style="text-decoration:none"><span class="ico nav-icon">⌁</span>误报分析</a><a class="item nav-item" href="04A-不良导出.html" style="text-decoration:none"><span class="ico nav-icon">⇩</span>不良分析</a><a class="item nav-item" href="13-品质预警.html" style="text-decoration:none"><span class="ico nav-icon">⚑</span>告警分析</a><div class="group nav-label">数据管理</div><a class="item nav-item" href="02-单板查询与结果追溯.html" style="text-decoration:none"><span class="ico nav-icon">▤</span>单板查询</a><a class="item nav-item" href="08-设备与区域管理.html" style="text-decoration:none"><span class="ico nav-icon">▦</span>设备管理</a><a class="item nav-item active" href="14-告警管理.html" style="text-decoration:none"><span class="ico nav-icon">⚙</span>告警管理</a><div class="group nav-label">系统管理</div><a class="item nav-item" href="10-用户管理.html" style="text-decoration:none"><span class="ico nav-icon">♟</span>用户管理</a><a class="item nav-item" href="11-角色管理.html" style="text-decoration:none"><span class="ico nav-icon">♧</span>角色管理</a><a class="item nav-item" href="12-个人中心.html" style="text-decoration:none"><span class="ico nav-icon">☻</span>个人中心</a></nav></aside>
  <div class="app">
    <header class="top"><div class="title"><h1>告警规则详情</h1></div><div class="top-actions"><button class="iconbtn" title="帮助">?</button><button class="iconbtn" title="刷新">◌</button><a class="account-entry" href="12-个人中心.html"><span class="account-avatar">管</span><span class="account-copy"><b>admin</b><small>平台管理员</small></span><span class="account-chevron">⌄</span></a></div></header>
    <main class="main"><div class="detail-breadcrumb"><a href="14-告警管理.html">告警管理</a><span>›</span><span>告警规则详情</span><a class="detail-back" href="14-告警管理.html">返回</a></div><div class="detail-content">
      <section class="panel form-panel" aria-label="告警规则只读详情">
        <section class="form-section"><h2>基础信息</h2><div class="section-fields basic-fields">
          <div class="form-field"><label>规则名称 <em>*</em></label><input id="rule-name" type="text" readonly></div>
          <div class="form-field"><label>告警级别 <em>*</em></label><select id="rule-level" disabled><option>紧急</option><option>一般</option></select></div>
          <div class="form-field"><label>状态 <em>*</em></label><select id="rule-status" disabled><option>启用</option><option>停用</option></select></div>
          <div class="form-field full"><label>备注</label><textarea id="rule-note" readonly></textarea></div>
        </div></section>
        <section class="form-section"><h2>推送配置</h2><div class="section-fields">
          <div class="form-field full"><label>推送消息模板 <em>*</em></label><textarea id="push-template" readonly>检测到告警，请及时处理。</textarea></div>
          <div class="push-row"><div class="form-field"><label>群名称 <em>*</em></label><input type="text" value="JLC-AOI品质报警" readonly></div><div class="form-field"><label>群 Webhook <em>*</em></label><input type="text" value="https://qyapi.weixin.qq.com/cgi-bin/webhook/…" readonly></div></div>
        </div></section>
        <section class="form-section"><h2>监控范围</h2><div class="section-fields monitor-fields">
          <div class="form-field"><label>监控周期 <em>*</em></label><div class="period-choice"><label><input id="period-real" type="radio" name="period" disabled> 实时</label><label><input id="period-fixed" type="radio" name="period" disabled> 固定周期</label></div></div>
          <div class="form-field period-field"><label>周期时长（小时） <em>*</em></label><input id="period-hours" type="text" readonly></div>
          <div class="form-field period-field"><label>统计节点 <em>*</em></label><select id="stat-node" disabled><option>08:00</option><option>20:00</option></select></div>
          <div class="form-field scope-field"><label>适用范围 <em>*</em></label><button class="scope-trigger" type="button" disabled><span id="scope-value">全部设备</span><span>⌄</span></button></div>
        </div></section>
        <section class="form-section"><h2>触发条件</h2><div class="section-fields"><div class="form-field full"><label>触发条件 <em>*</em></label><section class="rule-builder">
          <div class="rule-builder-head"><span>满足</span><select id="condition-relation" disabled><option>全部条件（AND）</option><option>任一条件（OR）</option></select><span>时触发告警</span></div>
          <div class="rule-line"><select id="condition-kind" disabled><option>阈值</option><option>连续次数</option><option>与上一周期对比</option><option>单片占比</option></select><select id="condition-verdict" disabled><option>一次复判</option><option>机器判定</option><option>二次复判</option></select><select id="condition-metric" disabled><option>板卡后良率</option><option>板卡直通率</option><option>板卡不良率</option><option>器件误报率</option><option>器件不良率</option><option>错料</option><option>漏件</option><option>反向</option><option>翻件</option><option>连锡</option><option>不良元件占比</option><option>误报元件占比</option></select><select id="condition-operator" disabled><option>小于</option><option>大于</option><option>等于</option><option>大于等于</option><option>小于等于</option><option>连续</option><option>下降</option><option>上升</option></select><input id="condition-value" type="text" readonly><select id="condition-unit" disabled><option>%</option><option>片</option><option>次</option></select></div>
        </section></div></div></section>
      </section>
    </div></main>
  </div>
  <script src="spc-prototype.js"></script>
  <script>
    (function(){
      var rules={
        'wrong-material':{name:'严重不良报警（错料）',level:'紧急',note:'连续3片',period:'实时',kind:'连续次数',verdict:'一次复判',metric:'错料',operator:'连续',value:'3',unit:'片'},
        'bridge':{name:'严重不良报警（连锡）',level:'紧急',note:'连续3片',period:'实时',kind:'连续次数',verdict:'一次复判',metric:'连锡',operator:'连续',value:'3',unit:'片'},
        'board-yield':{name:'板卡良率报警',level:'一般',note:'良率＜95%',period:'固定周期',hours:'12',node:'08:00',kind:'阈值',verdict:'一次复判',metric:'板卡后良率',operator:'小于',value:'95',unit:'%'},
        'pass-drop':{name:'直通率突降报警',level:'一般',note:'较前一天降幅＞5%',period:'固定周期',hours:'12',node:'08:00',kind:'与上一周期对比',verdict:'一次复判',metric:'板卡直通率',operator:'下降',value:'5',unit:'%'},
        'false-positive':{name:'误报率偏高报警',level:'一般',note:'误报率＞6.5%',period:'固定周期',hours:'12',node:'08:00',kind:'阈值',verdict:'一次复判',metric:'器件误报率',operator:'大于',value:'6.5',unit:'%'},
        'area-defect':{name:'区不良率波动报警',level:'一般',note:'增幅＞3%',period:'固定周期',hours:'12',node:'08:00',kind:'与上一周期对比',verdict:'一次复判',metric:'器件不良率',operator:'上升',value:'3',unit:'%'},
        'full-board':{name:'整片不良告警',level:'紧急',note:'不良30% 误报50%',period:'实时',kind:'单片占比',verdict:'机器判定',metric:'不良元件占比',operator:'大于',value:'30',unit:'%'}
      };
      var data=rules[new URLSearchParams(location.search).get('rule')]||rules['wrong-material'];
      function value(id,value){document.getElementById(id).value=value||''}
      value('rule-name',data.name);value('rule-level',data.level);value('rule-status','启用');value('rule-note',data.note);value('period-hours',data.hours);value('stat-node',data.node||'08:00');value('condition-relation','全部条件（AND）');value('condition-kind',data.kind);value('condition-verdict',data.verdict);value('condition-metric',data.metric);value('condition-operator',data.operator);value('condition-value',data.value);value('condition-unit',data.unit);
      document.getElementById(data.period==='固定周期'?'period-fixed':'period-real').checked=true;
      document.querySelectorAll('.period-field').forEach(function(field){field.hidden=data.period!=='固定周期'});
    })();
  </script>
</body>
