</div></main></div><script src="spc-prototype.js"></script><script>
(() => {
  const panels = [...document.querySelectorAll('.charts .chart')]; if (panels.length !== 4) return;
  document.querySelector('.alert-content > .metrics')?.remove();
  const periods = ['最近7天','最近一个月','最近半年']; let deviceMode = 'device', devicePeriod = '最近7天', trendMode = 'day', distributionPeriod = '最近7天';
  const periodButtons = (key, selected) => `<div class="alert-periods">${periods.map(item => `<button type="button" class="alert-period${item===selected?' active':''}" data-alert-period="${key}" data-period="${item}">${item}</button>`).join('')}</div>`;
  const grids = () => '<path d="M38 18H545M38 61H545M38 104H545M38 150H545" class="grid"/>';
  function renderAlertCount() {
    const panel = panels[0], phead = panel.querySelector('.phead'), body = panel.querySelector('.chart-body');
    phead.innerHTML = `<b>告警次数统计</b><div class="alert-chart-actions"><div class="legend"><span><i style="background:#df4a4a"></i>紧急</span><span><i style="background:#3478f6"></i>一般</span></div><div class="switcher"><button class="${deviceMode==='device'?'on':''}" data-alert-mode="device">设备</button><button class="${deviceMode==='region'?'on':''}" data-alert-mode="region">区域</button></div>${periodButtons('device',devicePeriod)}</div>`;
    const data = deviceMode==='device' ? [['AOI-01',16,3],['AOI-02',12,2],['AOI-03',19,4],['AOI-04',9,2],['AOI-05',14,3]] : [['区域A',20,5],['区域B',17,4],['区域C',14,3],['区域D',12,2]];
    const factor = devicePeriod==='最近7天'?1:devicePeriod==='最近一个月'?4:24, max=Math.max(...data.map(([,normal,urgent])=>(normal+urgent)*factor));
    body.innerHTML = `<svg viewBox="0 0 560 174" aria-label="${deviceMode==='device'?'按设备':'按区域'}告警次数统计">${grids()}${data.map(([name,normal,urgent],index) => { const total=(normal+urgent)*factor, normalCount=normal*factor, urgentCount=urgent*factor, x=72+index*(data.length===4?112:88), w=data.length===4?56:46, normalH=normalCount/max*120, urgentH=urgentCount/max*120; return `<rect class="alert-bar" x="${x}" y="${150-normalH}" width="${w}" height="${normalH}" rx="3" fill="#3478f6"><title>${name} 一般：${normalCount}次</title></rect><rect class="alert-bar" x="${x}" y="${150-normalH-urgentH}" width="${w}" height="${urgentH}" rx="3" fill="#df4a4a"><title>${name} 紧急：${urgentCount}次</title></rect><text class="axis" x="${x}" y="168">${name}</text>`; }).join('')}</svg>`;
    phead.querySelectorAll('[data-alert-mode]').forEach(button => button.addEventListener('click', () => { deviceMode=button.dataset.alertMode; renderAlertCount(); })); phead.querySelectorAll('[data-alert-period="device"]').forEach(button => button.addEventListener('click', () => { devicePeriod=button.dataset.period; renderAlertCount(); }));
  }
  function renderTrend() {
    const panel=panels[1], phead=panel.querySelector('.phead'), body=panel.querySelector('.chart-body'); const range=trendMode==='day'?'<div class="alert-date-range"><input type="date" aria-label="开始时间" value="2026-08-01"><span>至</span><input type="date" aria-label="结束时间" value="2026-08-07"></div>':'';
    phead.innerHTML=`<b>告警趋势统计</b><div class="alert-chart-actions"><div class="legend"><span><i style="background:#df4a4a"></i>紧急</span><span><i style="background:#3478f6"></i>一般</span></div>${range}<div class="switcher"><button class="${trendMode==='day'?'on':''}" data-trend-mode="day">按天</button><button class="${trendMode==='month'?'on':''}" data-trend-mode="month">按月</button></div></div>`;
    const points=trendMode==='day'?Array.from({length:7},(_,index)=>({date:`08-${String(index+1).padStart(2,'0')}`,normal:8+(index*3)%12,urgent:1+(index*2)%5})):['03月','04月','05月','06月','07月','08月'].map((date,index)=>({date,normal:48+index*7,urgent:7+index%4*3})); const width=560, plotLeft=48, plotRight=528, step=(plotRight-plotLeft)/points.length;
    body.classList.remove('alert-scroll'); body.innerHTML=`<svg viewBox="0 0 ${width} 174" preserveAspectRatio="xMidYMid meet" aria-label="${trendMode==='day'?'按天':'按月'}告警趋势">${grids()}${points.map((item,index)=>{const normal=Math.min(108,item.normal*5/(trendMode==='day'?1:3)), urgent=Math.min(36,item.urgent*5/(trendMode==='day'?1:3)), w=Math.min(42,Math.max(22,step*.58)), x=plotLeft+index*step+(step-w)/2, center=x+w/2; return `<rect class="alert-bar" x="${x}" y="${150-normal}" width="${w}" height="${normal}" rx="2" fill="#3478f6"><title>${item.date} 一般：${item.normal}次</title></rect><rect class="alert-bar" x="${x}" y="${150-normal-urgent}" width="${w}" height="${urgent}" rx="2" fill="#df4a4a"><title>${item.date} 紧急：${item.urgent}次</title></rect><text class="axis" x="${center}" y="168" text-anchor="middle">${item.date}</text>`;}).join('')}</svg>`;
    phead.querySelectorAll('[data-trend-mode]').forEach(button => button.addEventListener('click', () => { trendMode=button.dataset.trendMode; renderTrend(); }));
  }
  function renderDistribution() {
